<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Economy Pro Admin</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,Arial;background:#0f172a;color:#e5edf8}body{margin:0;padding:18px}.wrap{max-width:900px;margin:auto}.card{background:#111c31;border:1px solid #253650;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 16px 40px #0005}input,select,textarea,button{width:100%;box-sizing:border-box;margin:6px 0 12px;padding:12px;border-radius:12px;border:1px solid #31445f;background:#0b1324;color:#e5edf8;font:inherit}button{background:#2563eb;border:0;font-weight:800;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}pre{white-space:pre-wrap;background:#08111f;border-radius:14px;padding:14px;overflow:auto}.ok{color:#22c55e}.bad{color:#f87171}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Economy Pro Admin</h1><p>Введи <b>ADMIN_SECRET</b> из Netlify. Секрет не сохраняется на сервере, только в твоём браузере.</p><div class="card"><label>ADMIN_SECRET<input id="secret" type="password" placeholder="секрет из Netlify"></label><button id="saveSecret">Сохранить локально</button><button id="loadState">Загрузить состояние</button><p id="status"></p></div><div class="card"><h2>Управление доступом</h2><div class="row"><label>Telegram ID<input id="uid" placeholder="123456789"></label><label>ID устройства<input id="dev" placeholder="можно пусто"></label></div><div class="row"><label>Действие<select id="action"><option value="premium">Выдать премиум</option><option value="remove_premium">Убрать премиум</option><option value="ban">Заблокировать</option><option value="unban">Разблокировать</option><option value="lock_device">Привязать устройство</option><option value="unlock_device">Отвязать устройство</option></select></label><label>Срок до<input id="until" placeholder="2026-12-31"></label></div><label>Причина/заметка<textarea id="note" rows="3"></textarea></label><button id="apply">Применить</button></div><div class="card"><h2>Текущее состояние</h2><pre id="out">Нажми «Загрузить состояние»</pre></div></div><script>const $=s=>document.querySelector(s); $('#secret').value=localStorage.getItem('admin_secret')||''; $('#saveSecret').onclick=()=>{localStorage.setItem('admin_secret',$('#secret').value.trim()); msg('Сохранено локально','ok')}; function msg(t,c=''){ $('#status').className=c; $('#status').textContent=t } async function api(path,opt={}){const secret=$('#secret').value.trim(); if(!secret)throw new Error('Введи ADMIN_SECRET'); const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json','X-Admin-Secret':secret,...(opt.headers||{})}}); const j=await r.json().catch(()=>({})); if(!r.ok)throw new Error(j.error||r.statusText); return j} async function load(){try{const j=await api('/api/admin/state'); $('#out').textContent=JSON.stringify(j.state,null,2); msg('Загружено','ok')}catch(e){msg(e.message,'bad')}} $('#loadState').onclick=load; $('#apply').onclick=async()=>{try{const body={action:$('#action').value,user_id:$('#uid').value.trim(),device_id:$('#dev').value.trim(),until:$('#until').value.trim(),reason:$('#note').value.trim(),note:$('#note').value.trim()}; const j=await api('/api/admin/access',{method:'POST',body:JSON.stringify(body)}); $('#out').textContent=JSON.stringify(j.state,null,2); msg('Готово','ok')}catch(e){msg(e.message,'bad')}};</script></body></html>
